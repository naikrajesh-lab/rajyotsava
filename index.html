<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rajyotsava Breakfast</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#3a0d14;--mute:#7a5c60;--red:#c8102e;--yel:#ffc20e;--line:#ead9c0;--ok:#1b7f3b;--bad:#b3261e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1d0b0e;--card:#2b1216;--ink:#fbeede;--mute:#c4a3a0;--red:#ff5a6e;--line:#4a2a2e;--ok:#5fd28a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(var(--yel) 0 50%,var(--red) 50% 100%);height:14px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font:700 26px/1.15 Georgia,"Times New Roman",serif;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
nav{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
nav button{flex:1;padding:10px 8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 14px inherit;white-space:nowrap}
nav button.on{background:var(--red);border-color:var(--red);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=password],input[type=file]{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--red);color:#fff;font:700 16px inherit;margin-top:14px;text-align:center;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.step{display:flex;align-items:center;gap:12px}
.step button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px}
.step b{min-width:24px;text-align:center;font-size:20px}
.total{font:700 28px Georgia,serif;color:var(--red)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--line)}
.pill.Approved{background:var(--ok);color:#fff}.pill.Rejected{background:var(--bad);color:#fff}.pill.Pending{background:var(--yel);color:#3a0d14}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-weight:600}
.msg.err{background:rgba(179,38,30,.14);color:var(--bad)}.msg.good{background:rgba(27,127,59,.14);color:var(--ok)}
.qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:12px;margin:10px auto;width:max-content}
.code{font:700 22px ui-monospace,Menlo,monospace;text-align:center;letter-spacing:1px}
#reader{width:100%;border-radius:12px;overflow:hidden}
.hide{display:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.stat b{font-size:20px;display:block}
small,.mute{color:var(--mute)}
a{color:var(--red)}
</style>
</head>
<body>
<header></header>
<div class="wrap">
  <h1 id="title">Rajyotsava Breakfast</h1>
  <p class="sub" id="sub">Loading…</p>
  <nav id="nav">
    <button data-t="sub" class="on">Subscribe</button>
    <button data-t="pass">My pass</button>
    <button data-t="vol">Volunteer</button>
    <button data-t="adm">Admin</button>
  </nav>

  <!-- SUBSCRIBE -->
  <section id="t-sub">
    <div id="subForm" class="card">
      <label>Flat number</label><input type="text" id="flat" placeholder="A-304" autocapitalize="characters">
      <label>Name</label><input type="text" id="name">
      <label>Phone</label><input type="tel" id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile">
      <div class="row" style="margin-top:14px"><div><b>Adults</b><br><small id="ap"></small></div>
        <div class="step"><button data-s="a-">−</button><b id="na">2</b><button data-s="a+">+</button></div></div>
      <div class="row" style="margin-top:10px"><div><b>Kids</b><br><small id="kp"></small></div>
        <div class="step"><button data-s="k-">−</button><b id="nk">0</b><button data-s="k+">+</button></div></div>
      <div class="row" style="margin-top:16px"><span>Total to pay</span><span class="total" id="tot">₹0</span></div>
      <p class="mute" style="margin:12px 0 0;font-size:14px">Pay the exact total using any UPI app to this UPI ID, then upload the screenshot below.</p>
      <div class="row card" style="margin:8px 0 0;padding:10px 12px"><b id="upiId" style="word-break:break-all"></b><button class="btn alt" id="copyUpi" style="width:auto;margin:0;padding:8px 14px">Copy</button></div>
      <label>Payment screenshot</label><input type="file" id="shot" accept="image/*">
      <div id="subMsg"></div>
      <button class="btn" id="subBtn">Submit for approval</button>
    </div>
    <div id="subDone" class="card hide"></div>
  </section>

  <!-- MY PASS -->
  <section id="t-pass" class="hide">
    <div class="card">
      <label>Phone number used while subscribing</label>
      <input type="tel" id="lphone" inputmode="numeric" maxlength="10">
      <button class="btn" id="lBtn">Show my pass</button>
    </div>
    <div id="lOut"></div>
  </section>

  <!-- VOLUNTEER -->
  <section id="t-vol" class="hide">
    <div class="card" id="vPin">
      <label>Volunteer PIN</label><input type="password" id="vpin" inputmode="numeric">
      <button class="btn" id="vGo">Start scanning</button>
    </div>
    <div id="vMain" class="hide">
      <div id="reader"></div>
      <div class="card"><label>No camera? Type the code</label>
        <div class="row"><input type="text" id="manual" placeholder="RJ-XXXXX" autocapitalize="characters"><button class="btn alt" id="mGo" style="width:auto;margin:0;padding:11px 16px">Find</button></div></div>
      <div id="vOut"></div>
    </div>
  </section>

  <!-- ADMIN -->
  <section id="t-adm" class="hide">
    <div class="card" id="aPin">
      <label>Admin PIN</label><input type="password" id="apin" inputmode="numeric">
      <button class="btn" id="aGo">Open admin</button>
    </div>
    <div id="aMain" class="hide">
      <div class="stat" id="aStat"></div>
      <nav id="aNav"><button data-f="Pending" class="on">Pending</button><button data-f="Approved">Approved</button><button data-f="Rejected">Rejected</button><button data-f="All">All</button></nav>
      <div id="aList"></div>
      <button class="btn alt" id="aRef">Refresh</button>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
// ====== PASTE YOUR APPS SCRIPT WEB APP URL HERE ======
const API = 'https://script.google.com/macros/s/AKfycbwWLwEEX3diHpFFY1CcNQxQybEQ_hqjd_a_Egpg44LJkp5Y59Esbl3JY_7eNs6SR8lYjA/exec';
// =====================================================

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let C = {}, na = 2, nk = 0, vpin = '', apin = '', filter = 'Pending', allPasses = [], scanner = null, busy = false;

async function get(q) { const r = await fetch(API + '?' + new URLSearchParams(q)); return r.json(); }
async function post(b) { const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(b) }); return r.json(); }
const msg = (el, t, k) => $(el).innerHTML = t ? `<div class="msg ${k}">${esc(t)}</div>` : '';
function qr(el, text) { el.innerHTML = ''; new QRCode(el, { text, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); }

// ---------- tabs ----------
$('nav').onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  [...$('nav').children].forEach(b => b.classList.toggle('on', b === e.target));
  ['sub', 'pass', 'vol', 'adm'].forEach(x => $('t-' + x).classList.toggle('hide', x !== t));
  if (t !== 'vol') stopScan();
  if (t === 'vol' && vpin) startScan();
};

// ---------- config ----------
async function init() {
  try {
    const c = await get({ action: 'config' }); C = c;
    document.title = c.event; $('title').textContent = c.event;
    $('sub').textContent = 'Subscribe by ' + new Date(c.deadline).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
    $('ap').textContent = '₹' + c.adultPrice + ' each'; $('kp').textContent = '₹' + c.kidPrice + ' each';
    $('upiId').textContent = c.upiId; calc();
    const saved = JSON.parse(localStorage.getItem('rjPhone') || 'null'); if (saved) $('lphone').value = saved;
  } catch (e) { $('sub').textContent = 'Could not reach the server. Check the web app URL in index.html.'; }
}
function calc() {
  const t = na * C.adultPrice + nk * C.kidPrice;
  $('na').textContent = na; $('nk').textContent = nk; $('tot').textContent = '₹' + t;
}
$('subForm').addEventListener('click', e => {
  const s = e.target.dataset.s; if (!s) return;
  if (s === 'a+') na = Math.min(20, na + 1); if (s === 'a-') na = Math.max(0, na - 1);
  if (s === 'k+') nk = Math.min(20, nk + 1); if (s === 'k-') nk = Math.max(0, nk - 1);
  calc();
});
$('flat').oninput = calc;
$('copyUpi').onclick = async () => { try { await navigator.clipboard.writeText(C.upiId); $('copyUpi').textContent = 'Copied'; setTimeout(() => $('copyUpi').textContent = 'Copy', 1500); } catch (e) { prompt('Copy this UPI ID', C.upiId); } };

// ---------- subscribe ----------
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.7).split(',')[1]); URL.revokeObjectURL(u);
    };
    img.onerror = rej; img.src = u;
  });
}
$('subBtn').onclick = async () => {
  const f = $('shot').files[0];
  if (!$('flat').value.trim() || !$('name').value.trim() || $('phone').value.length !== 10) return msg('subMsg', 'Fill flat, name and a 10-digit phone.', 'err');
  if (na + nk < 1) return msg('subMsg', 'Add at least one member.', 'err');
  if (!f) return msg('subMsg', 'Attach the payment screenshot.', 'err');
  $('subBtn').disabled = true; msg('subMsg', 'Submitting…', 'good');
  try {
    const r = await post({ action: 'submit', flat: $('flat').value, name: $('name').value, phone: $('phone').value, adults: na, kids: nk, shot: await compress(f) });
    if (!r.ok) throw new Error(r.error);
    localStorage.setItem('rjPhone', JSON.stringify($('phone').value));
    $('subForm').classList.add('hide'); $('subDone').classList.remove('hide');
    $('subDone').innerHTML = `<div class="msg good">Submitted. The admin will verify your payment and approve it.</div>
      <p>Your reference code</p><div class="code">${esc(r.code)}</div>
      <p class="mute">Come back to <b>My pass</b> with your phone number to see your QR code once approved.</p>`;
    $('lphone').value = $('phone').value;
  } catch (e) { msg('subMsg', e.message, 'err'); }
  $('subBtn').disabled = false;
};

// ---------- my pass ----------
$('lBtn').onclick = async () => {
  const p = $('lphone').value.trim(); if (p.length !== 10) return $('lOut').innerHTML = '<div class="msg err">Enter a 10-digit phone.</div>';
  $('lOut').innerHTML = '<p class="mute">Looking…</p>';
  const r = await get({ action: 'lookup', phone: p });
  if (!r.passes.length) return $('lOut').innerHTML = '<div class="msg err">No subscription found for this number.</div>';
  $('lOut').innerHTML = r.passes.map((x, i) => `<div class="card">
    <div class="row"><b>Flat ${esc(x.flat)} · ${esc(x.name)}</b><span class="pill ${x.status}">${x.status}</span></div>
    <p style="margin:6px 0">${x.adults} adults, ${x.kids} kids${x.ra + x.rk ? ` <small>(served ${x.ra + x.rk})</small>` : ''}</p>
    ${x.status === 'Approved' ? `<div class="qr" id="q${i}"></div><div class="code">${esc(x.code)}</div><p class="mute" style="text-align:center">Show this at the breakfast counter</p>`
      : x.status === 'Pending' ? '<p class="mute">Waiting for admin to verify your payment.</p>' : '<p class="mute">Payment could not be verified. Contact the committee.</p>'}</div>`).join('');
  r.passes.forEach((x, i) => x.status === 'Approved' && qr($('q' + i), x.code));
};

// ---------- volunteer ----------
$('vGo').onclick = async () => {
  vpin = $('vpin').value;
  const r = await post({ action: 'get', pin: vpin, code: 'RJ-TEST0' });
  if (r.error === 'Wrong PIN') { vpin = ''; return alert('Wrong PIN'); }
  $('vPin').classList.add('hide'); $('vMain').classList.remove('hide'); startScan();
};
function startScan() {
  if (scanner) return;
  scanner = new Html5Qrcode('reader');
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 }, txt => lookup(txt), () => {}).catch(() => { $('reader').innerHTML = '<div class="msg err">Camera not available. Type the code below.</div>'; scanner = null; });
}
function stopScan() { if (scanner) { scanner.stop().catch(() => {}); scanner = null; $('reader').innerHTML = ''; } }
$('mGo').onclick = () => lookup($('manual').value);
async function lookup(code) {
  if (busy) return; busy = true;
  const r = await post({ action: 'get', pin: vpin, code });
  busy = false; showPass(r);
}
let sa = 0, sk = 0, cur = null;
function showPass(r) {
  if (!r.ok) { $('vOut').innerHTML = `<div class="card"><div class="msg err">${esc(r.error)}</div></div>`; return; }
  cur = r.pass; const ra = cur.adults - cur.ra, rk = cur.kids - cur.rk; sa = ra; sk = rk;
  const done = ra + rk === 0, ok = cur.status === 'Approved';
  $('vOut').innerHTML = `<div class="card">
    <div class="row"><b style="font-size:20px">Flat ${esc(cur.flat)}</b><span class="pill ${done ? 'Rejected' : cur.status}">${done ? 'Fully served' : cur.status}</span></div>
    <div>${esc(cur.name)} · <small>${esc(cur.code)}</small></div>
    <p class="mute" style="margin:6px 0">Booked ${cur.adults} adults, ${cur.kids} kids. Served ${cur.ra} adults, ${cur.rk} kids.</p>
    ${ok && !done ? `<div class="row" style="margin-top:8px"><b>Adults now (max ${ra})</b><div class="step"><button data-v="a-">−</button><b id="va">${sa}</b><button data-v="a+">+</button></div></div>
    <div class="row" style="margin-top:8px"><b>Kids now (max ${rk})</b><div class="step"><button data-v="k-">−</button><b id="vk">${sk}</b><button data-v="k+">+</button></div></div>
    <button class="btn ok" id="redeem">Serve breakfast</button>` : `<div class="msg err">${done ? 'Already fully redeemed' + (cur.last ? '' : '') : 'Pass is ' + esc(cur.status)}</div>`}
    <button class="btn alt" id="clr">Scan next</button></div>`;
  $('clr').onclick = () => $('vOut').innerHTML = '';
  if ($('redeem')) $('redeem').onclick = async () => {
    $('redeem').disabled = true;
    const x = await post({ action: 'redeem', pin: vpin, code: cur.code, adults: sa, kids: sk });
    if (!x.ok) return showPass({ ok: false, error: x.error });
    $('vOut').innerHTML = `<div class="card"><div class="msg good">Served ${sa} adults, ${sk} kids — Flat ${esc(x.pass.flat)}</div><p class="mute">Remaining on this pass: ${x.pass.adults - x.pass.ra} adults, ${x.pass.kids - x.pass.rk} kids.</p><button class="btn alt" id="clr">Scan next</button></div>`;
    $('clr').onclick = () => $('vOut').innerHTML = '';
  };
}
$('vOut').addEventListener('click', e => {
  const v = e.target.dataset.v; if (!v || !cur) return;
  const ra = cur.adults - cur.ra, rk = cur.kids - cur.rk;
  if (v === 'a+') sa = Math.min(ra, sa + 1); if (v === 'a-') sa = Math.max(0, sa - 1);
  if (v === 'k+') sk = Math.min(rk, sk + 1); if (v === 'k-') sk = Math.max(0, sk - 1);
  $('va').textContent = sa; $('vk').textContent = sk;
});

// ---------- admin ----------
$('aGo').onclick = async () => {
  apin = $('apin').value; const r = await post({ action: 'list', pin: apin });
  if (!r.ok) { apin = ''; return alert(r.error); }
  $('aPin').classList.add('hide'); $('aMain').classList.remove('hide'); allPasses = r.passes; renderAdmin();
};
$('aRef').onclick = async () => { const r = await post({ action: 'list', pin: apin }); if (r.ok) { allPasses = r.passes; renderAdmin(); } };
$('aNav').onclick = e => { if (!e.target.dataset.f) return; filter = e.target.dataset.f; [...$('aNav').children].forEach(b => b.classList.toggle('on', b === e.target)); renderAdmin(); };
function renderAdmin() {
  const ap = allPasses.filter(p => p.status === 'Approved');
  const sum = k => ap.reduce((a, p) => a + p[k], 0);
  $('aStat').innerHTML = `<div><b>${sum('adults')}</b>adults</div><div><b>${sum('kids')}</b>kids</div><div><b>₹${sum('amount')}</b>collected</div>
    <div><b>${sum('ra')}</b>adults served</div><div><b>${sum('rk')}</b>kids served</div><div><b>${allPasses.filter(p => p.status === 'Pending').length}</b>pending</div>`;
  const list = allPasses.filter(p => filter === 'All' || p.status === filter);
  $('aList').innerHTML = list.length ? list.map(p => `<div class="card">
    <div class="row"><b>Flat ${esc(p.flat)} · ${esc(p.name)}</b><span class="pill ${p.status}">${p.status}</span></div>
    <div class="mute">${esc(p.phone)} · ${p.adults} adults, ${p.kids} kids · <b>₹${p.amount}</b></div>
    <div class="mute">${p.shot ? `<a href="${esc(p.shot)}" target="_blank" rel="noopener">screenshot</a>` : 'no screenshot'}</div>
    <div class="row" style="gap:8px">${p.status !== 'Approved' ? `<button class="btn ok" data-a="Approved" data-c="${p.code}">Approve</button>` : ''}
    ${p.status !== 'Rejected' ? `<button class="btn bad" data-a="Rejected" data-c="${p.code}">Reject</button>` : ''}</div></div>`).join('') : '<p class="mute">Nothing here.</p>';
}
$('aList').onclick = async e => {
  const a = e.target.dataset.a; if (!a) return; e.target.disabled = true;
  const r = await post({ action: 'setStatus', pin: apin, code: e.target.dataset.c, status: a });
  if (!r.ok) return alert(r.error);
  allPasses.find(p => p.code === e.target.dataset.c).status = a; renderAdmin();
};

init();
</script>
</body>
</html>
